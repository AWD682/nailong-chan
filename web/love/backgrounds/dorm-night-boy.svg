<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <filter id="r" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="201" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6b0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f6e6b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#ffe9a8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#f6e6b0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f6e6b0" stop-opacity="0"/>
